<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>90 Day Progress</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r-lg: 14px; --r: 9px; --r-sm: 6px;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }

/* light */
:root {
  --bg: #EDF0F5; --surface: #FFFFFF; --surface-2: #F4F6FA; --line: #D9DEE8; --line-2: #C6CDDA;
  --text: #1A2233; --muted: #5E6779; --accent: #3651D4; --accent-soft: #E3E8FC; --on-accent: #FFFFFF;
  --today: #B97D00; --good: #23875C; --good-soft: #D6EFE3; --warn: #A87A12; --warn-soft: #F6EACB;
  --bad: #C4453A; --bad-soft: #F8DEDA; --none: #DEE3EB; --future: #EEF1F6;
  --shadow: 0 1px 2px rgba(20, 30, 60, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151A24; --surface: #1C2230; --surface-2: #232A3A; --line: #2D3548; --line-2: #3A4459;
    --text: #E6E9F0; --muted: #8F98AB; --accent: #9DB0FF; --accent-soft: #28315A; --on-accent: #10162A;
    --today: #F2C14E; --good: #58B98C; --good-soft: #1D3A30; --warn: #E0B04A; --warn-soft: #3B3320;
    --bad: #E56B60; --bad-soft: #43262A; --none: #2A3244; --future: #1F2533;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151A24; --surface: #1C2230; --surface-2: #232A3A; --line: #2D3548; --line-2: #3A4459;
  --text: #E6E9F0; --muted: #8F98AB; --accent: #9DB0FF; --accent-soft: #28315A; --on-accent: #10162A;
  --today: #F2C14E; --good: #58B98C; --good-soft: #1D3A30; --warn: #E0B04A; --warn-soft: #3B3320;
  --bad: #E56B60; --bad-soft: #43262A; --none: #2A3244; --future: #1F2533;
  --shadow: none; color-scheme: dark;
}

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--display); margin: 0; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
h1 { font-size: 30px; } h2 { font-size: 18px; } h3 { font-size: 16px; } h4 { font-size: 14px; }
b { font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .block { display: block; }
.good-text { color: var(--good); } .bad-text { color: var(--bad); } .danger-text { color: var(--bad) !important; }
.overdue { color: var(--bad); font-size: 12px; }
.spacer { flex: 1; }
.icon { flex: none; vertical-align: -3px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 216px 1fr; min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 2px; padding: 20px 12px; border-right: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 600; font-size: 16px; padding: 0 8px 18px; }
.brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--today); color: #1a1405; font-size: 16px; font-weight: 700; letter-spacing: -0.03em; }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border: 0; background: none; border-radius: var(--r); color: var(--muted); cursor: pointer; text-align: left; font-size: 14.5px; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.on { background: var(--accent-soft); color: var(--text); font-weight: 500; }
.nav-item.on .icon { color: var(--accent); }
.theme-toggle { margin-top: auto; }
.main { min-width: 0; padding: 28px 36px 64px; }
.page { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head p { margin: 4px 0 0; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: sticky; top: 0; z-index: 20; height: auto; flex-direction: row; align-items: center; padding: 8px 10px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .brand { padding: 0 6px 0 2px; } .brand > span:last-child { display: none; }
  .side nav { flex-direction: row; }
  .nav-item { padding: 7px 9px; white-space: nowrap; font-size: 13.5px; gap: 6px; }
  .nav-item:not(.on) span { display: none; }
  .theme-toggle { margin: 0; } .theme-toggle span { display: none; }
  .main { padding: 18px 14px 48px; }
  h1 { font-size: 24px; }
}

/* ---------- buttons & inputs ---------- */
.btn { display: inline-flex; align-items: center; gap: 7px; justify-content: center; padding: 8px 14px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn-ghost { border-color: transparent; background: none; color: var(--muted); }
.btn-ghost:hover { color: var(--text); }
.btn-small { padding: 5px 10px; font-size: 13px; }
.btn-danger { border-color: var(--bad); color: var(--bad); background: none; }
.btn.armed, .icon-btn.armed { background: var(--bad); color: #fff !important; border-color: var(--bad); }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: var(--r-sm); border: 0; background: none; color: var(--muted); cursor: pointer; }
.icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.icon-btn:disabled { opacity: .3; cursor: default; }
.icon-btn.small { width: 26px; height: 26px; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; font-size: inherit; }
.link-btn:hover { text-decoration: underline; }
input:not([type=checkbox]):not([type=range]):not([type=file]), select, textarea {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 7px 10px; min-width: 0; font-size: 14px;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
textarea { resize: vertical; width: 100%; line-height: 1.45; }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; flex: none; }
input[type=range] { accent-color: var(--accent); width: 100%; }
select { cursor: pointer; }
.mini-num { width: 64px; text-align: right; }
.bare { border: 1px solid transparent !important; background: transparent !important; padding: 2px 4px !important; }
.bare:hover { border-color: var(--line) !important; }
.bare:focus { border-color: var(--accent) !important; background: var(--surface-2) !important; }
.bare.h3 { font-family: var(--display); font-weight: 600; font-size: 17px; }
.grow { flex: 1; }

.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; min-width: 0; }
.field-label { font-size: 13px; color: var(--muted); font-weight: 500; }
.field-hint { font-size: 12px; color: var(--muted); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); column-gap: 14px; }
.form-grid.five { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.inline-add { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inline-add input:not([type=checkbox]) { flex: 1; min-width: 140px; }
.inline-add .mini-num { flex: none; min-width: 0; }
.inline-check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.row-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

/* ---------- panels ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 20px; box-shadow: var(--shadow); min-width: 0; }
.panel-accent { border-color: color-mix(in srgb, var(--today) 45%, var(--line)); }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.two-col.wide-left { grid-template-columns: 1.4fr 1fr; }
@media (max-width: 1000px) { .two-col, .two-col.wide-left { grid-template-columns: 1fr; } }
.sub { margin: 18px 0 8px; font-size: 14px; color: var(--muted); font-weight: 600; font-family: var(--body); }
.empty { padding: 22px; text-align: center; color: var(--muted); border: 1px dashed var(--line-2); border-radius: var(--r); }
.empty p { margin: 0 0 12px; } .empty p:last-child { margin: 0; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; max-width: 1180px; margin: 0 auto 16px; }
.banner.sample { background: var(--warn-soft); border-color: transparent; }
.banner.warn { background: var(--bad-soft); border-color: transparent; }
.page .banner { margin: 0; max-width: none; }

/* ---------- progress ---------- */
.bar { position: relative; height: 10px; border-radius: 99px; background: var(--none); overflow: visible; }
.bar-thin { height: 6px; }
.bar-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width .35s ease; }
.bar-fill.tone-bad { background: var(--bad); }
.bar-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); opacity: .75; border-radius: 1px; transform: translateX(-1px); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill-good { background: var(--good-soft); color: var(--good); }
.pill-warn { background: var(--warn-soft); color: var(--warn); }
.pill-bad { background: var(--bad-soft); color: var(--bad); }

/* ---------- hero ---------- */
.hero { display: flex; flex-direction: column; gap: 16px; padding-bottom: 4px; }
.hero-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
.hero-day { font-size: 64px; line-height: .95; letter-spacing: -0.04em; font-weight: 700; }
.hero-day span { color: var(--muted); font-weight: 500; font-size: 36px; letter-spacing: -0.02em; }
.hero-sub { margin: 8px 0 0; color: var(--muted); }
.hero-pace { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.hero-bar { max-width: none; }
@media (max-width: 600px) { .hero-day { font-size: 46px; } .hero-day span { font-size: 26px; } .hero-pace { align-items: flex-start; } }

.strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.strip-label { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; display: flex; gap: 8px; }
.strip-label span { color: var(--text); font-weight: 500; }
.strip-cells { display: grid; grid-template-columns: repeat(30, 1fr); gap: 3px; }
.cell { height: 34px; border: 0; padding: 0; border-radius: 3px; cursor: pointer; min-width: 0; }
.cell:disabled { cursor: default; }
.cell:hover:not(:disabled) { filter: brightness(1.2); }
.cell.is-today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--today); position: relative; z-index: 1; }
.strip-ms { position: relative; height: 10px; }
.ms-tick { position: absolute; top: 3px; width: 7px; height: 7px; transform: translateX(-50%) rotate(45deg); background: var(--muted); }
.ms-tick.done { background: var(--good); }
@media (max-width: 700px) { .strip { gap: 6px; } .strip-cells { gap: 1px; } .cell { height: 26px; border-radius: 1px; } .strip-label span { display: none; } }

.att-Present { background: var(--good); }
.att-Partial { background: var(--warn); }
.att-Absent { background: var(--bad); }
.att-None { background: var(--none); }
.att-Pending { background: var(--none); }
.att-Future, .att-Outside { background: var(--future); border: 1px dashed var(--line) !important; }

/* ---------- stats ---------- */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow); }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 16px 20px; border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat-label { font-size: 13px; color: var(--muted); }
.stat-value { font-family: var(--display); font-size: 34px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat-sub { font-size: 12.5px; color: var(--muted); }
@media (max-width: 860px) { .stats { grid-template-columns: 1fr 1fr; } .stat:nth-child(3) { border-left: 0; } .stat:nth-child(n+3) { border-top: 1px solid var(--line); } }

.mini-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 8px; }
.mini-stats > div { display: flex; flex-direction: column; padding: 10px 12px; background: var(--surface-2); border-radius: var(--r); }
.mini-stats b { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.mini-stats span { font-size: 12.5px; color: var(--muted); }
.mini-stats.big b { font-size: 24px; }
.page > .mini-stats > div { background: var(--surface); border: 1px solid var(--line); }

/* ---------- tasks ---------- */
.task-list { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; }
.task { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--line); }
.task:last-child { border-bottom: 0; }
.check { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line-2); background: none; display: grid; place-items: center; cursor: pointer; color: var(--on-accent); padding: 0; }
.check:hover { border-color: var(--accent); }
.check.on { background: var(--good); border-color: var(--good); color: #fff; }
.task-main { min-width: 0; cursor: pointer; }
.task-title { font-size: 14.5px; overflow-wrap: anywhere; }
.task.is-done .task-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-2); }
.task.is-skipped .task-title { color: var(--muted); font-style: italic; }
.task-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; margin-top: 3px; }
.note-snip { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-select { font-size: 12.5px !important; padding: 4px 6px !important; }
.task .mini-num { width: 58px; font-size: 12.5px !important; padding: 4px 6px !important; }
@media (max-width: 560px) { .task { grid-template-columns: auto 1fr; } .task .status-select, .task .mini-num { grid-column: 2; justify-self: start; } .task .mini-num { margin-top: -6px; } }
.cat { padding: 1px 7px; border-radius: 4px; font-weight: 500; background: var(--surface-2); }
.cat-Study { color: #7A8CF0; } .cat-DSA { color: #C27BE0; } .cat-Programming { color: #4BA3C7; } .cat-Project { color: #D98E3B; }
.cat-Exercise { color: var(--good); } .cat-Reading { color: #B89A3A; } .cat-Other { color: var(--muted); }
.cat-bg-Study { background: #7A8CF0; } .cat-bg-DSA { background: #C27BE0; } .cat-bg-Programming { background: #4BA3C7; } .cat-bg-Project { background: #D98E3B; }
.cat-bg-Exercise { background: var(--good); } .cat-bg-Reading { background: #B89A3A; } .cat-bg-Other { background: var(--muted); }
.prio { color: var(--muted); } .prio-High { color: var(--bad); font-weight: 600; }
.quick-add { display: flex; gap: 8px; flex-wrap: wrap; }
.quick-add input:first-child { flex: 1 1 220px; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters input { flex: 1; min-width: 140px; }
.day-group .panel-head { margin-bottom: 4px; }

.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); flex-wrap: wrap; align-self: flex-start; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 6px; cursor: pointer; font-size: 13.5px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--text); font-weight: 500; box-shadow: 0 0 0 1px var(--line); }
.seg-label { padding: 5px 6px; }
.tabs { margin-bottom: 2px; }

/* ---------- recommendations ---------- */
.rec-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.rec { padding: 12px 14px; border-radius: var(--r); background: var(--surface-2); }
.rec-head { display: flex; align-items: center; gap: 10px; }
.rec-num { font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--today); width: 18px; flex: none; }
.rec-title { flex: 1; font-weight: 600; font-size: 14.5px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.rec-min { font-weight: 500; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rec-bullets { margin: 6px 0 6px 28px; padding: 0 0 0 14px; font-size: 13.5px; color: var(--muted); }
.rec-reason { margin-left: 28px; font-size: 12px; color: var(--muted); }
.rec-reason.hi { color: var(--bad); }
.rec-note { margin: 0 0 10px; font-size: 14px; }
.recs > .small { margin: 12px 0 0; }

/* ---------- goals / projects ---------- */
.goal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.goal-grid.full { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
@media (max-width: 420px) { .goal-grid.full { grid-template-columns: 1fr; } }
.goal, .project { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); min-width: 0; }
.goal-compact { gap: 8px; }
.goal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.goal-head h3 { font-size: 16.5px; }
.goal-why { margin: 0; color: var(--muted); font-size: 14px; }
.goal-prog { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.goal-prog b { font-family: var(--display); font-size: 26px; letter-spacing: -0.02em; }
.goal-next { margin: 0; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 2px 9px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); text-decoration: none; }
button.chip { cursor: pointer; }
.chip.on { background: var(--accent-soft); color: var(--text); border-color: var(--accent); }
.chip-link { color: var(--accent); }
.milestones, .checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.milestones { counter-reset: ms; }
.milestones li, .checklist li { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 14px; }
.milestones li label, .checklist li label { flex: 1; display: flex; align-items: center; gap: 9px; cursor: pointer; }
.milestones li.done span:not(.muted), .checklist li.done span { color: var(--muted); text-decoration: line-through; }
.milestones li .icon-btn, .checklist li .icon-btn { opacity: 0; }
.milestones li:hover .icon-btn, .checklist li:hover .icon-btn, .milestones li .icon-btn:focus, .checklist li .icon-btn:focus { opacity: 1; }
@media (hover: none) { .milestones li .icon-btn, .checklist li .icon-btn { opacity: 1; } }
.project .sub { margin: 6px 0 0; }
.pstatus { font-size: 12.5px !important; padding: 3px 6px !important; font-weight: 600; }
.ps-Building { color: var(--accent); } .ps-Testing { color: var(--warn); } .ps-Completed { color: var(--good); }

/* ---------- roadmap ---------- */
.where { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
.where > div, .where-strip > div { display: flex; flex-direction: column; gap: 2px; }
.where-strip { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); flex-wrap: wrap; }
.where-strip > div { flex: 1 1 200px; }
@media (max-width: 700px) { .where-strip > .icon { transform: rotate(90deg); } }
.months { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 1000px) { .months { grid-template-columns: 1fr; } }
.month { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.month.is-current { border-color: var(--today); }
.month-head { display: flex; flex-direction: column; gap: 2px; }
.month-num { font-size: 12.5px; color: var(--muted); padding-left: 4px; }
.month.is-current .month-num { color: var(--today); font-weight: 600; }
.month-prog { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
.month-prog .mini-num { width: 54px; padding: 2px 6px !important; }
.rm-items { list-style: none; margin: 4px 0; padding: 0; display: flex; flex-direction: column; }
.rm-items li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.rm-title { flex: 1; font-size: 14px; min-width: 120px; }
.rm-items li.done .rm-title { color: var(--muted); text-decoration: line-through; }
.kind { font-size: 12px !important; padding: 2px 4px !important; background: transparent !important; color: var(--muted) !important; }
.rm-ctl { display: flex; }
.skill-title { display: flex; flex-direction: column; }
.skill-targets { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.skill-targets .mini-num { width: 54px; padding: 2px 6px !important; }
.skill .bar { margin-bottom: 10px; }
.table-wrap { overflow-x: auto; }
.topics { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 620px; }
.topics th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
.topics td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.topics select { font-size: 13px !important; padding: 3px 6px !important; }
.topic-extra { display: block; }
.topic-comp { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.topic-comp span { font-variant-numeric: tabular-nums; width: 38px; text-align: right; font-size: 13px; }
.ts-Completed td:first-child .link-btn { color: var(--good); }
.diff { font-size: 12.5px; } .diff-Hard { color: var(--bad); } .diff-Medium { color: var(--warn); } .diff-Easy { color: var(--good); }

.timeline { padding: 70px 8px 70px; overflow-x: auto; }
.tl-track { position: relative; height: 14px; display: grid; grid-template-columns: repeat(3, 1fr); min-width: 640px; }
.tl-month { border: 1px solid var(--line-2); background: var(--surface-2); position: relative; }
.tl-month:first-child { border-radius: 99px 0 0 99px; } .tl-month:nth-child(3) { border-radius: 0 99px 99px 0; }
.tl-month span { position: absolute; top: 20px; left: 8px; font-size: 12px; color: var(--muted); display: none; }
.tl-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 99px; opacity: .85; pointer-events: none; }
.tl-today { position: absolute; top: -8px; bottom: -8px; width: 2px; background: var(--today); }
.tl-today span { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 12px; color: var(--today); font-weight: 600; }
.tl-ms { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
.tl-ms i { width: 12px; height: 12px; transform: rotate(45deg); background: var(--surface); border: 2px solid var(--muted); margin-top: 1px; }
.tl-ms.done i { background: var(--good); border-color: var(--good); }
.tl-ms span { position: absolute; bottom: 24px; font-size: 12px; white-space: nowrap; text-align: center; display: flex; flex-direction: column; line-height: 1.3; }
.tl-ms span b { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.tl-ms.below span { bottom: auto; top: 34px; }
.tl-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 48px; min-width: 640px; }
.tl-list { list-style: none; padding: 0; margin: 0 0 10px; }
.tl-list li { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.tl-list li.done input.bare { text-decoration: line-through; color: var(--muted); }
.tl-list .mini-num { width: 56px; padding: 2px 6px !important; }

/* ---------- calendar ---------- */
.cal-head { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 14px; }
.cal-head h2 { min-width: 180px; text-align: center; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-dow { font-size: 12.5px; color: var(--muted); text-align: center; padding-bottom: 2px; }
.cal-cell { min-height: 96px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); padding: 7px 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; cursor: pointer; text-align: left; border-left-width: 4px; min-width: 0; }
.cal-cell:hover { border-color: var(--line-2); }
.cal-cell.empty-cell { background: none; border: 0; cursor: default; }
.cal-cell.out { opacity: .45; }
.cal-cell.is-today { outline: 2px solid var(--today); outline-offset: 1px; }
.att-edge-Present { border-left-color: var(--good); } .att-edge-Partial { border-left-color: var(--warn); } .att-edge-Absent { border-left-color: var(--bad); }
.cal-date { font-size: 13px; font-weight: 600; display: flex; gap: 6px; width: 100%; justify-content: space-between; }
.cal-date em { font-style: normal; font-weight: 400; color: var(--muted); font-size: 11.5px; }
.cal-pct { font-family: var(--display); font-size: 20px; font-weight: 600; line-height: 1.2; }
.cal-meta { font-size: 11.5px; color: var(--muted); }
.cal-att { margin-top: auto; font-size: 11px; font-weight: 600; }
.att-t-Present { color: var(--good); } .att-t-Partial { color: var(--warn); } .att-t-Absent { color: var(--bad); } .att-t-None, .att-t-Pending { color: var(--muted); }
@media (max-width: 640px) { .cal { gap: 3px; } .cal-cell { min-height: 58px; padding: 4px; border-left-width: 3px; } .cal-meta, .cal-att, .cal-date em { display: none; } .cal-pct { font-size: 13px; } }

.heatmap-wrap { overflow-x: auto; }
.heatmap { display: flex; gap: 4px; }
.hm-col { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.hm-wk { font-size: 10.5px; color: var(--muted); height: 14px; }
.hm { width: 22px; height: 22px; border-radius: 4px; border: 0; padding: 0; cursor: pointer; }
.hm:disabled { cursor: default; }
.hm.is-today { box-shadow: 0 0 0 2px var(--today); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.att-row { display: grid; grid-template-columns: 110px 48px 1fr; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; }

/* ---------- day modal ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(8, 12, 22, .55); display: grid; place-items: center; z-index: 50; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); animation: fade .15s ease; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); width: min(560px, 100%); max-height: 100%; display: flex; flex-direction: column; animation: rise .18s ease; }
.modal-wide { width: min(760px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 10px; }
.modal-body { padding: 4px 20px 20px; overflow-y: auto; }
.modal-actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
@keyframes fade { from { opacity: 0; } } @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.day-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 14px; }
.att-badge { margin-left: auto; padding: 2px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 600; color: #fff; border: 0 !important; }
.att-badge.att-None, .att-badge.att-Pending, .att-badge.att-Future, .att-badge.att-Outside { color: var(--muted); }
.att-controls { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.journal textarea { min-height: 36px; }

/* ---------- analytics ---------- */
.chart { max-width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--body); }
.chart .ref { stroke: var(--good); stroke-dasharray: 5 5; stroke-width: 1.2; opacity: .8; }
.chart .today-line { stroke: var(--today); stroke-width: 1.5; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; opacity: .55; }
.chart .line-avg { fill: none; stroke: var(--text); stroke-width: 2; stroke-dasharray: 6 4; }
.chart .pt { fill: var(--accent); }
.chart .pt.clickable { cursor: pointer; }
.chart .pt:hover { r: 5; }
.barc.s-plan { fill: var(--line-2); } .barc.s-act { fill: var(--accent); }
.sw.s-plan { background: var(--line-2); } .sw.s-act { background: var(--accent); }
.hbars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.hbars li { display: grid; grid-template-columns: 100px 1fr 50px; gap: 10px; align-items: center; font-size: 14px; }
.hbars b { text-align: right; font-variant-numeric: tabular-nums; }
.hbar { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.hbar i { display: block; height: 100%; border-radius: 99px; }
.compare { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.compare > div { display: flex; flex-direction: column; gap: 3px; }
.compare b { font-family: var(--display); font-size: 22px; display: flex; align-items: center; gap: 8px; }
@media (max-width: 600px) { .compare { grid-template-columns: 1fr; } }
.score { display: grid; grid-template-columns: 130px 1fr; gap: 10px 22px; align-items: start; }
.score > p { grid-column: 1 / -1; margin: 0; }
.score-total b { font-family: var(--display); font-size: 58px; line-height: 1; letter-spacing: -0.04em; }
.score-total span { color: var(--muted); font-size: 18px; }
.score-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.score-table th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 4px 8px; border-bottom: 1px solid var(--line); }
.score-table td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
.score-table th:not(:first-child), .score-table td:not(:first-child) { text-align: right; width: 70px; }
@media (max-width: 600px) { .score { grid-template-columns: 1fr; } }
.streaks { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 12px; }
.streaks > div { display: flex; flex-direction: column; }
.streaks b { font-family: var(--display); font-size: 28px; }

/* ---------- reviews ---------- */
.review { display: flex; flex-direction: column; gap: 10px; }
.review-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.review-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px 28px; }
.plain { margin: 0; padding-left: 18px; font-size: 14px; display: flex; flex-direction: column; gap: 3px; }
.next-week { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 8px; }
.next-week h3 { font-size: 17px; }
.week-chips { gap: 8px; }
.week-sum p { margin: 6px 0 0; }
.tva { display: flex; flex-direction: column; gap: 10px; }
.tva-row { display: grid; grid-template-columns: 120px 1fr 190px; gap: 14px; align-items: center; font-size: 14px; }
@media (max-width: 600px) { .tva-row { grid-template-columns: 1fr; gap: 4px; } }

/* ---------- settings ---------- */
.start-own p { margin: 6px 0 14px; max-width: 70ch; }
.data-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.danger-zone { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.danger-zone p { margin: 4px 0 10px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 99px; font-size: 14px; z-index: 60; animation: rise .18s ease; }

.rec-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.rec-early { margin: 14px 0 8px; }
.muted-list .rec { background: none; border: 1px dashed var(--line-2); }
.rm-items li { position: relative; flex-wrap: nowrap; }
.rm-ctl { position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 1px; opacity: 0; pointer-events: none; }
.rm-items li:hover .rm-ctl, .rm-items li:focus-within .rm-ctl { opacity: 1; pointer-events: auto; }
@media (hover: none) { .rm-items li { flex-wrap: wrap; } .rm-ctl { position: static; transform: none; opacity: 1; pointer-events: auto; border: 0; } }
.month-prog .mini-num, .skill-targets .mini-num { width: 60px; }
